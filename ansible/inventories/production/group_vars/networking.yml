networking:
  base_domain: victus.io

  private_dns:
    zone: victus.io
    provider: coredns
    tailscale_interface: tailscale0

  tls:
    provider: letsencrypt
    challenge: http-01
    certbot_email: "carlos@victus.io"
    cert_name: core-edge-victus-io

  vhosts:
    - name: seaweed-master
      domains:
        - seaweed.victus.io
      upstream: seaweedfs:9333
      exposure: private
      access_policy: private
      preserve_host: false
      http:
        enabled: true
        redirect_to_https: false
      https:
        enabled: false

    - name: seaweed-filer
      domains:
        - filer.victus.io
      upstream: seaweedfs:8888
      exposure: private
      access_policy: private
      preserve_host: false
      http:
        enabled: true
        redirect_to_https: false
      https:
        enabled: false

    - name: seaweed-s3
      domains:
        - s3.victus.io
        - "*.s3.victus.io"
      upstream: seaweedfs:8333
      exposure: private
      access_policy: private
      preserve_host: true
      http:
        enabled: true
        redirect_to_https: false
      https:
        enabled: false

    - name: litellm
      domains:
        - litellm.victus.io
      upstream: litellm:4000
      exposure: private
      access_policy: private
      preserve_host: true
      http:
        enabled: true
        redirect_to_https: false
      https:
        enabled: false

    - name: phoenix
      domains:
        - phoenix.victus.io
      upstream: phoenix:6006
      exposure: private
      access_policy: private
      preserve_host: true
      http:
        enabled: true
        redirect_to_https: false
      https:
        enabled: false

    - name: wiki
      domains:
        - wiki.victus.fit
      upstream: wiki:3000
      exposure: public
      access_policy: public
      preserve_host: true
      http:
        enabled: true
        redirect_to_https: true
      https:
        enabled: true

    - name: victus-app
      domains:
        - app.victus.fit
      upstream: frontend:5173
      exposure: public
      access_policy: public
      preserve_host: true
      http:
        enabled: true
        redirect_to_https: true
      https:
        enabled: true
