shared_docker_networks:
  - infra_shared_backend

deploy:
  core:
    name: core
    project_dir: "{{ srv_apps_root }}/core"
    compose_files:
      - src: "{{ playbook_dir }}/../../compose/projects/core/compose.yml"
        dest: "{{ srv_apps_root }}/core/compose.yml"
      - src: "{{ playbook_dir }}/../../compose/projects/core/compose.prod.yml"
        dest: "{{ srv_apps_root }}/core/compose.prod.yml"
    compose_cli_files:
      - "{{ srv_apps_root }}/core/compose.yml"
      - "{{ srv_apps_root }}/core/compose.prod.yml"
    env_path: "{{ srv_secrets_root }}/runtime/core.env"
    compose_services:
      - nginx-private
      - nginx-public
      - seaweedfs
      - etcd
      - coredns
      - pipeline-postgres
      - redis
    directories:
      - { path: "{{ srv_apps_root }}/core/nginx/private/conf.d", mode: "0755" }
      - { path: "{{ srv_apps_root }}/core/nginx/public/conf.d", mode: "0755" }
      - { path: "{{ srv_apps_root }}/core/nginx/snippets", mode: "0755" }
      - { path: "{{ srv_apps_root }}/core/nginx/acme", mode: "0755" }
      - { path: "{{ srv_apps_root }}/core/coredns", mode: "0755" }
      - { path: "{{ srv_apps_root }}/core/scripts", mode: "0755" }
      - { path: "{{ srv_apps_root }}/core/seaweedfs", mode: "0755" }
      - { path: "{{ srv_data_root }}/etcd/core-dns", mode: "0755" }
      - { path: "{{ srv_data_root }}/pipeline/postgres", owner: "70", group: "70", mode: "0700" }
      - { path: "{{ srv_data_root }}/redis", mode: "0750" }
    staged_secret_files:
      - source_file: "{{ lookup('ansible.builtin.env', 'CORE_RUNTIME_ENV_SOURCE_FILE') | default('', true) }}"
        dest: "{{ srv_secrets_root }}/runtime/core.env"
        mode: "0600"
        recreate_services:
          - nginx-private
          - seaweedfs
          - coredns
          - pipeline-postgres
          - redis
      - source_file: "{{ lookup('ansible.builtin.env', 'CORE_RUNTIME_SEAWEED_S3_SOURCE_FILE') | default('', true) }}"
        dest: "{{ srv_secrets_root }}/runtime/seaweed-s3.json"
        mode: "0600"
        recreate_services:
          - seaweedfs
    required_files:
      - "{{ srv_secrets_root }}/runtime/core.env"
      - "{{ srv_secrets_root }}/runtime/seaweed-s3.json"
    config_files:
      - src: "{{ playbook_dir }}/../../compose/configs/nginx/nginx.conf"
        dest: "{{ srv_apps_root }}/core/nginx/nginx.conf"
        restart_services:
          - nginx-private
          - nginx-public
      - src: "{{ playbook_dir }}/../../compose/configs/nginx/snippets/private-access.conf"
        dest: "{{ srv_apps_root }}/core/nginx/snippets/private-access.conf"
        restart_services:
          - nginx-private
      - src: "{{ playbook_dir }}/../../compose/configs/coredns/Corefile"
        dest: "{{ srv_apps_root }}/core/coredns/Corefile"
        restart_services:
          - coredns
      - src: "{{ playbook_dir }}/../../ops/scripts/runtime/sync-core-dns.sh"
        dest: "{{ srv_apps_root }}/core/scripts/sync-core-dns.sh"
        mode: "0755"
      - src: "{{ playbook_dir }}/../../ops/scripts/runtime/apply-s3-buckets.py"
        dest: "{{ srv_apps_root }}/core/scripts/apply-s3-buckets.py"
        mode: "0755"
      - src: "{{ playbook_dir }}/../../compose/configs/seaweedfs/buckets.json"
        dest: "{{ srv_apps_root }}/core/seaweedfs/buckets.json"

  observability:
    name: observability
    project_dir: "{{ srv_apps_root }}/observability"
    compose_files:
      - src: "{{ playbook_dir }}/../../compose/projects/observability/compose.yml"
        dest: "{{ srv_apps_root }}/observability/compose.yml"
      - src: "{{ playbook_dir }}/../../compose/projects/observability/compose.prod.yml"
        dest: "{{ srv_apps_root }}/observability/compose.prod.yml"
    compose_cli_files:
      - "{{ srv_apps_root }}/observability/compose.yml"
      - "{{ srv_apps_root }}/observability/compose.prod.yml"
    env_path: "{{ srv_secrets_root }}/runtime/observability.env"
    compose_services:
      - loki
      - prometheus
    directories:
      - { path: "{{ srv_apps_root }}/observability/loki", mode: "0755" }
      - { path: "{{ srv_apps_root }}/observability/prometheus", mode: "0755" }
    staged_secret_files:
      - source_file: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_RUNTIME_ENV_SOURCE_FILE') | default('', true) }}"
        dest: "{{ srv_secrets_root }}/runtime/observability.env"
        mode: "0600"
        recreate_services:
          - loki
          - prometheus
    required_files:
      - "{{ srv_secrets_root }}/runtime/observability.env"
    config_files:
      - src: "{{ playbook_dir }}/../../compose/configs/loki/config.yml"
        dest: "{{ srv_apps_root }}/observability/loki/config.yml"
        restart_services:
          - loki
      - src: "{{ playbook_dir }}/../../compose/configs/prometheus/prometheus.yml"
        dest: "{{ srv_apps_root }}/observability/prometheus/prometheus.yml"
        restart_services:
          - prometheus

  llm:
    name: llm
    project_dir: "{{ srv_apps_root }}/llm"
    compose_files:
      - src: "{{ playbook_dir }}/../../compose/projects/llm/compose.yml"
        dest: "{{ srv_apps_root }}/llm/compose.yml"
      - src: "{{ playbook_dir }}/../../compose/projects/llm/compose.prod.yml"
        dest: "{{ srv_apps_root }}/llm/compose.prod.yml"
    compose_cli_files:
      - "{{ srv_apps_root }}/llm/compose.yml"
      - "{{ srv_apps_root }}/llm/compose.prod.yml"
    env_path: "{{ srv_secrets_root }}/runtime/llm.env"
    compose_services:
      - llm-postgres
      - litellm
    directories:
      - { path: "{{ srv_apps_root }}/llm/litellm", mode: "0755" }
      - { path: "{{ srv_apps_root }}/llm/llm-postgres/init", mode: "0755" }
      - { path: "{{ srv_data_root }}/llm/postgres", owner: "70", group: "70", mode: "0700" }
    staged_secret_files:
      - source_file: "{{ lookup('ansible.builtin.env', 'LLM_RUNTIME_ENV_SOURCE_FILE') | default('', true) }}"
        dest: "{{ srv_secrets_root }}/runtime/llm.env"
        mode: "0600"
        recreate_services:
          - llm-postgres
          - litellm
    required_files:
      - "{{ srv_secrets_root }}/runtime/llm.env"
    config_files:
      - src: "{{ playbook_dir }}/../../ops/scripts/runtime/render-litellm-config.py"
        dest: "{{ srv_apps_root }}/llm/litellm/render-litellm-config.py"
        mode: "0755"
      - src: "{{ playbook_dir }}/../../compose/configs/llm-postgres/init/01-create-llm-databases.sh"
        dest: "{{ srv_apps_root }}/llm/llm-postgres/init/01-create-llm-databases.sh"
        mode: "0755"

  wiki:
    name: wiki
    project_dir: "{{ srv_apps_root }}/wiki"
    compose_files:
      - src: "{{ playbook_dir }}/../../compose/projects/wiki/compose.yml"
        dest: "{{ srv_apps_root }}/wiki/compose.yml"
      - src: "{{ playbook_dir }}/../../compose/projects/wiki/compose.prod.yml"
        dest: "{{ srv_apps_root }}/wiki/compose.prod.yml"
    compose_cli_files:
      - "{{ srv_apps_root }}/wiki/compose.yml"
      - "{{ srv_apps_root }}/wiki/compose.prod.yml"
    env_path: "{{ srv_secrets_root }}/runtime/wiki.env"
    compose_services:
      - wiki
      - wiki-database
    directories:
      - { path: "{{ srv_apps_root }}/wiki", mode: "0755" }
      - { path: "{{ srv_data_root }}/wiki/postgres", owner: "70", group: "70", mode: "0700" }

  app:
    name: app
    project_dir: "{{ srv_apps_root }}/app"
    compose_files:
      - src: "{{ playbook_dir }}/../../compose/projects/app/compose.yml"
        dest: "{{ srv_apps_root }}/app/compose.yml"
      - src: "{{ playbook_dir }}/../../compose/projects/app/compose.prod.yml"
        dest: "{{ srv_apps_root }}/app/compose.prod.yml"
    compose_cli_files:
      - "{{ srv_apps_root }}/app/compose.yml"
      - "{{ srv_apps_root }}/app/compose.prod.yml"
    env_path: "{{ srv_secrets_root }}/runtime/app.env"
    compose_services:
      - app-postgres
      - agent-postgres
      - qdrant
      - phoenix
      - backend
      - frontend
      - agent-db-upgrade
      - agent-langgraph-setup
      - rag
      - agent-chat
      - agent-mcp
    directories:
      - { path: "{{ srv_apps_root }}/app", mode: "0755" }
      - { path: "{{ srv_data_root }}/app/app-postgres", owner: "999", group: "999", mode: "0700" }
      - { path: "{{ srv_data_root }}/app/agent-postgres", owner: "999", group: "999", mode: "0700" }
      - { path: "{{ srv_data_root }}/app/qdrant", owner: "1000", group: "1000", mode: "0750" }
      - { path: "{{ srv_data_root }}/app/phoenix", owner: "1000", group: "1000", mode: "0750" }
