---
- name: Derive core domain variables
  ansible.builtin.set_fact:
    core_base_domain: "{{ networking.base_domain }}"
    core_certbot_email: >-
      {{
        networking.tls.certbot_email
        | default(host.admin_user ~ '@' ~ networking.base_domain, true)
      }}
    core_vhosts: "{{ networking.vhosts | default([]) }}"
    core_cert_name: "{{ networking.tls.cert_name | default('core-edge-' ~ (networking.base_domain | replace('.', '-')), true) }}"
    deploy_core_compose_args: >-
      {{
        '-f ' ~ (deploy_stack.compose_cli_files | join(' -f '))
      }}

- name: Validate required core domain variables
  ansible.builtin.assert:
    that:
      - core_base_domain | length > 0
      - core_vhosts | length > 0
    fail_msg: "Core deploy requires networking.base_domain and at least one networking.vhosts entry."

- name: Derive core TLS certificate domains
  ansible.builtin.set_fact:
    core_cert_domains: >-
      {{
        core_vhosts
        | selectattr('exposure', 'equalto', 'public')
        | selectattr('https.enabled', 'defined')
        | selectattr('https.enabled')
        | map(attribute='domains')
        | list
        | flatten
        | reject('match', '^\\*\\.')
        | unique
        | list
      }}

- name: Install certbot packages for core TLS
  ansible.builtin.apt:
    name:
      - certbot
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 300

- name: Allow HTTP and HTTPS through UFW
  ansible.builtin.command: "ufw allow {{ item }}/tcp"
  loop:
    - 80
    - 443
  register: deploy_core_ufw_allow_rule
  changed_when: >-
    'Rule added' in deploy_core_ufw_allow_rule.stdout or
    'Rules updated' in deploy_core_ufw_allow_rule.stdout

- name: Allow private TCP services through Tailscale only
  ansible.builtin.command: "ufw allow in on {{ networking.private_dns.tailscale_interface }} to any port {{ item }} proto tcp"
  loop:
    - 5432
    - 6379
  register: deploy_core_ufw_allow_private_tcp
  changed_when: >-
    'Rule added' in deploy_core_ufw_allow_private_tcp.stdout or
    'Rules updated' in deploy_core_ufw_allow_private_tcp.stdout

- name: Check whether core TLS certificate already exists
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ core_cert_name }}/fullchain.pem"
  register: core_tls_cert

- name: Ensure core deploy directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode }}"
  loop: "{{ deploy_stack.directories | default([]) }}"

- name: Stage core runtime secret files
  ansible.builtin.copy:
    src: "{{ item.source_file }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode | default('0600') }}"
  loop: "{{ deploy_stack.staged_secret_files | default([]) }}"
  when: item.source_file | default('') | length > 0
  register: deploy_core_secret_copy

- name: Assert required core runtime files exist
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ deploy_stack.required_files | default([]) }}"
  register: deploy_core_required_files

- name: Stop core deploy when required files missing
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: "Missing required core file: {{ item.item }}"
  loop: "{{ deploy_core_required_files.results }}"

- name: Read core runtime env
  ansible.builtin.slurp:
    path: "{{ deploy_stack.env_path }}"
  register: deploy_core_runtime_env_raw

- name: Validate core database runtime env
  ansible.builtin.assert:
    that:
      - deploy_core_postgres_password is not none
      - deploy_core_postgres_password | length >= 16
      - deploy_core_postgres_password != 'change-me'
      - deploy_core_redis_password is not none
      - deploy_core_redis_password | length >= 16
      - deploy_core_redis_password != 'change-me'
    fail_msg: >-
      Core runtime env at {{ deploy_stack.env_path }} must define POSTGRES_PASSWORD
      and REDIS_PASSWORD with at least 16 characters and not use local defaults.
  vars:
    deploy_core_runtime_env_text: "{{ deploy_core_runtime_env_raw.content | b64decode }}"
    deploy_core_postgres_password: "{{ deploy_core_runtime_env_text | regex_findall('(?m)^POSTGRES_PASSWORD=(.+)$') | first | default(none) }}"
    deploy_core_redis_password: "{{ deploy_core_runtime_env_text | regex_findall('(?m)^REDIS_PASSWORD=(.+)$') | first | default(none) }}"

- name: Copy core static config files
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode | default('0644') }}"
  loop: "{{ deploy_stack.config_files | default([]) }}"
  register: deploy_core_config_copy

- name: Copy core stack compose files
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ deploy_stack.compose_files }}"
  register: deploy_core_compose_copy

- name: Render private core nginx routing
  ansible.builtin.template:
    src: nginx-private.conf.j2
    dest: "{{ deploy_stack.project_dir }}/nginx/private/conf.d/core.conf"
    owner: root
    group: root
    mode: "0644"
  vars:
    core_vhosts: "{{ core_vhosts }}"
  register: deploy_core_nginx_private_template

- name: Render public core nginx routing
  ansible.builtin.template:
    src: nginx-public.conf.j2
    dest: "{{ deploy_stack.project_dir }}/nginx/public/conf.d/core.conf"
    owner: root
    group: root
    mode: "0644"
  vars:
    core_vhosts: "{{ core_vhosts }}"
    core_cert_name: "{{ core_cert_name }}"
    core_tls_enabled: "{{ core_tls_cert.stat.exists }}"
  register: deploy_core_nginx_public_template_pre_tls

- name: Link active environment file into the core stack directory
  ansible.builtin.file:
    src: "{{ deploy_stack.env_path }}"
    dest: "{{ deploy_stack.project_dir }}/.env"
    state: link
  register: deploy_core_env_link

- name: Enforce SeaweedFS S3 runtime config permissions
  ansible.builtin.file:
    path: "{{ srv_secrets_root }}/runtime/seaweed-s3.json"
    owner: "1000"
    group: "1000"
    mode: "0400"
  register: deploy_core_seaweed_s3_permissions

- name: Read SeaweedFS S3 runtime config metadata
  ansible.builtin.stat:
    path: "{{ srv_secrets_root }}/runtime/seaweed-s3.json"
  register: deploy_core_seaweed_s3_stat

- name: Validate SeaweedFS S3 runtime config permissions
  ansible.builtin.assert:
    that:
      - deploy_core_seaweed_s3_stat.stat.exists
      - deploy_core_seaweed_s3_stat.stat.uid == 1000
      - deploy_core_seaweed_s3_stat.stat.gid == 1000
      - deploy_core_seaweed_s3_stat.stat.mode == '0400'
    fail_msg: >-
      SeaweedFS runtime config at {{ srv_secrets_root }}/runtime/seaweed-s3.json
      must be owned by 1000:1000 with mode 0400 before container start.

- name: Validate SeaweedFS S3 runtime config is valid JSON
  ansible.builtin.command:
    cmd: python3 -m json.tool {{ srv_secrets_root }}/runtime/seaweed-s3.json
  changed_when: false

- name: Validate SeaweedFS bucket contract is valid JSON
  ansible.builtin.command:
    cmd: python3 -m json.tool {{ deploy_stack.project_dir }}/seaweedfs/buckets.json
  changed_when: false

- name: Read SeaweedFS S3 runtime config
  ansible.builtin.slurp:
    path: "{{ srv_secrets_root }}/runtime/seaweed-s3.json"
  register: deploy_core_seaweed_s3_config_raw

- name: Validate SeaweedFS S3 runtime config structure
  ansible.builtin.assert:
    that:
      - deploy_core_seaweed_s3_config.identities is defined
      - deploy_core_seaweed_s3_config.identities | length > 0
      - deploy_core_seaweed_s3_credentials | length > 0
      - deploy_core_seaweed_s3_credentials | selectattr('accessKey', 'defined') | list | length > 0
      - deploy_core_seaweed_s3_credentials | selectattr('secretKey', 'defined') | list | length > 0
    fail_msg: >-
      SeaweedFS runtime config at {{ srv_secrets_root }}/runtime/seaweed-s3.json
      must define at least one identity with accessKey and secretKey.
  vars:
    deploy_core_seaweed_s3_config: "{{ deploy_core_seaweed_s3_config_raw.content | b64decode | from_json }}"
    deploy_core_seaweed_s3_credentials: >-
      {{
        deploy_core_seaweed_s3_config.identities
        | map(attribute='credentials')
        | select('defined')
        | list
        | flatten
      }}

- name: Sync core private DNS runtime env before Compose deploy
  ansible.builtin.command:
    cmd: "{{ deploy_stack.project_dir }}/scripts/sync-core-dns.sh"
  environment:
    CORE_ENV_FILE: "{{ deploy_stack.env_path }}"
    CORE_COMPOSE_OVERLAY: "{{ deploy_stack.project_dir }}/compose.prod.yml"
  register: deploy_core_dns_presync
  changed_when: "'Updated runtime env file:' in deploy_core_dns_presync.stdout"

- name: Validate rendered core Compose configuration
  ansible.builtin.command:
    cmd: docker compose --env-file {{ deploy_stack.env_path }} {{ deploy_core_compose_args }} config
  environment:
    COMPOSE_PROGRESS: plain
  changed_when: false

- name: Deploy the core stack
  ansible.builtin.command:
    cmd: docker compose --env-file {{ deploy_stack.env_path }} {{ deploy_core_compose_args }} up -d
  environment:
    COMPOSE_PROGRESS: plain
  register: deploy_core_up
  changed_when: >-
    'Started' in deploy_core_up.stdout or
    'Recreated' in deploy_core_up.stdout or
    'Creating' in deploy_core_up.stdout

- name: Obtain or renew core TLS certificate
  ansible.builtin.command:
    cmd: >-
      certbot certonly --non-interactive --agree-tos
      --email {{ core_certbot_email }}
      --cert-name {{ core_cert_name }}
      {% if core_tls_cert.stat.exists %}--expand{% else %}--duplicate{% endif %}
      --webroot -w {{ deploy_stack.project_dir }}/nginx/acme
      {% for domain in core_cert_domains %}-d {{ domain }} {% endfor %}
      --keep-until-expiring
  when: core_cert_domains | length > 0
  register: core_certbot_result
  changed_when: >-
    'Successfully received certificate' in core_certbot_result.stdout or
    'Congratulations' in core_certbot_result.stdout or
    'Certificate not yet due for renewal' not in core_certbot_result.stdout

- name: Re-check core TLS certificate
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ core_cert_name }}/fullchain.pem"
  when: core_cert_domains | length > 0
  register: core_tls_cert_after

- name: Ensure core TLS certificate exists
  ansible.builtin.assert:
    that:
      - core_tls_cert_after.stat.exists
    fail_msg: "Core TLS certificate was not created by certbot."
  when: core_cert_domains | length > 0

- name: Render public core nginx routing with TLS enabled
  ansible.builtin.template:
    src: nginx-public.conf.j2
    dest: "{{ deploy_stack.project_dir }}/nginx/public/conf.d/core.conf"
    owner: root
    group: root
    mode: "0644"
  vars:
    core_vhosts: "{{ core_vhosts }}"
    core_cert_name: "{{ core_cert_name }}"
    core_tls_enabled: "{{ core_cert_domains | length > 0 }}"
  register: deploy_core_nginx_public_template_tls
  when: core_cert_domains | length > 0

- name: Redeploy the core stack with TLS enabled
  ansible.builtin.command:
    cmd: docker compose --env-file {{ deploy_stack.env_path }} {{ deploy_core_compose_args }} up -d
  environment:
    COMPOSE_PROGRESS: plain
  register: deploy_core_tls_up
  when: core_cert_domains | length > 0
  changed_when: >-
    'Started' in deploy_core_tls_up.stdout or
    'Recreated' in deploy_core_tls_up.stdout or
    'Creating' in deploy_core_tls_up.stdout

- name: Derive core runtime actions
  ansible.builtin.set_fact:
    deploy_core_recreate_services: >-
      {{
        (
          (
            deploy_core_secret_copy.results | default([])
            | selectattr('changed')
            | map(attribute='item.recreate_services')
            | select('defined')
            | list
            | flatten
          )
          + (
            ['seaweedfs']
            if deploy_core_seaweed_s3_permissions.changed
            else []
          )
          + (
            deploy_stack.compose_services | default([])
            if (
              deploy_core_compose_copy.results | default([])
              | selectattr('changed')
              | list
              | length
            ) > 0 or deploy_core_env_link.changed
            else []
          )
        ) | unique
      }}

- name: Derive core config-only restarts
  ansible.builtin.set_fact:
    deploy_core_restart_services: >-
      {{
        (
          (
            deploy_core_config_copy.results | default([])
            | selectattr('changed')
            | map(attribute='item.restart_services')
            | select('defined')
            | list
            | flatten
          )
          + (
            ['nginx-private']
            if deploy_core_nginx_private_template.changed
            else []
          )
          + (
            ['nginx-public']
            if deploy_core_nginx_public_template_pre_tls.changed or
              (deploy_core_nginx_public_template_tls is defined and deploy_core_nginx_public_template_tls.changed)
            else []
          )
        ) | unique | difference(deploy_core_recreate_services | default([]))
      }}

- name: Force recreate core services with runtime definition changes
  ansible.builtin.command:
    cmd: >-
      docker compose --env-file {{ deploy_stack.env_path }}
      {{ deploy_core_compose_args }}
      up -d --force-recreate {{ deploy_core_recreate_services | join(' ') }}
  environment:
    COMPOSE_PROGRESS: plain
  when: deploy_core_recreate_services | length > 0
  register: deploy_core_force_recreate
  changed_when: >-
    'Started' in deploy_core_force_recreate.stdout or
    'Recreated' in deploy_core_force_recreate.stdout or
    'Creating' in deploy_core_force_recreate.stdout

- name: Restart core services with config-only changes
  ansible.builtin.command:
    cmd: >-
      docker compose --env-file {{ deploy_stack.env_path }}
      {{ deploy_core_compose_args }}
      restart {{ deploy_core_restart_services | join(' ') }}
  environment:
    COMPOSE_PROGRESS: plain
  when: deploy_core_restart_services | length > 0
  register: deploy_core_restart
  changed_when: deploy_core_restart_services | length > 0

- name: Sync core private DNS records
  ansible.builtin.command:
    cmd: "{{ deploy_stack.project_dir }}/scripts/sync-core-dns.sh"
  environment:
    CORE_ENV_FILE: "{{ deploy_stack.env_path }}"
    CORE_COMPOSE_OVERLAY: "{{ deploy_stack.project_dir }}/compose.prod.yml"
  register: deploy_core_dns_sync
  changed_when: "'Updated records:' in deploy_core_dns_sync.stdout"

- name: Apply SeaweedFS S3 bucket contract
  ansible.builtin.command:
    cmd: >-
      docker run --rm
      --network core_core_backend
      -v {{ deploy_stack.project_dir }}/scripts/apply-s3-buckets.py:/apply-s3-buckets.py:ro
      -v {{ deploy_stack.project_dir }}/seaweedfs/buckets.json:/buckets.json:ro
      -v {{ srv_secrets_root }}/runtime/seaweed-s3.json:/seaweed-s3.json:ro
      python:3.12-alpine
      python /apply-s3-buckets.py
      --contract /buckets.json
      --seaweed-s3-config /seaweed-s3.json
      --endpoint http://seaweedfs:8333
      --wait-timeout 120
      --wait-interval 3
  register: deploy_core_s3_buckets
  retries: 3
  delay: 10
  until: deploy_core_s3_buckets.rc == 0
  changed_when: "'[CREATE]' in deploy_core_s3_buckets.stdout"
