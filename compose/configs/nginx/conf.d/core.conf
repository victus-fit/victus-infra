server {
  listen 80 default_server;
  server_name _;
  
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = / {
    return 404;
  }

  location /seaweed/master/ {
    set $upstream seaweedfs:9333;
    proxy_pass http://$upstream/;
  }

  location /seaweed/filer/ {
    set $upstream seaweedfs:8888;
    proxy_pass http://$upstream/;
  }

  location /prometheus/ {
    set $upstream prometheus:9090;
    proxy_pass http://$upstream/;
  }

  location /loki/ {
    set $upstream loki:3100;
    proxy_pass http://$upstream/;
  }
}

server {
  listen 80;
  server_name s3.victus.io *.s3.victus.io s3.carlosjg.space;

  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  location / {
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    set $upstream seaweedfs:8333;
    proxy_pass http://$upstream;
  }
}

server {
  listen 80;
  server_name litellm.victus.io litellm.localhost;

  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  location / {
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect http://litellm.victus.io:4000/ http://litellm.victus.io/;
    proxy_redirect http://litellm.localhost:4000/ http://litellm.localhost:8080/;
    set $upstream litellm:4000;
    proxy_pass http://$upstream;
  }
}

