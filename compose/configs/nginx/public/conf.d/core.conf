server {
  listen 80 default_server;
  server_name _;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    try_files $uri =404;
  }

  location / {
    return 404;
  }
}

server {
  listen 80;
  server_name wiki.victus.fit;

  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    try_files $uri =404;
  }

  location / {
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    set $upstream wiki:3000;
    proxy_pass http://$upstream;
  }
}

server {
  listen 80;
  server_name victus.fit;

  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  location / {
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    set $upstream frontend:5173;
    proxy_pass http://$upstream;
  }
}
