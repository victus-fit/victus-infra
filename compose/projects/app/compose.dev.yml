services:
  app-postgres:
    ports:
      - "${APP_POSTGRES_BIND_IP:-127.0.0.1}:${APP_POSTGRES_PORT:-5432}:5432"
    volumes:
      - ../../.tmp/app/app-postgres:/var/lib/postgresql/data

  agent-postgres:
    ports:
      - "${AGENT_POSTGRES_BIND_IP:-127.0.0.1}:${AGENT_POSTGRES_PORT:-5433}:5432"
    volumes:
      - ../../.tmp/app/agent-postgres:/var/lib/postgresql/data

  qdrant:
    ports:
      - "${QDRANT_BIND_IP:-127.0.0.1}:${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_BIND_IP:-127.0.0.1}:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - ../../.tmp/app/qdrant:/qdrant/storage

  phoenix:
    ports:
      - "${PHOENIX_BIND_IP:-127.0.0.1}:${PHOENIX_PORT:-6006}:6006"
    volumes:
      - ../../.tmp/app/phoenix:/mnt/data

  backend:
    ports:
      - "${BACKEND_BIND_IP:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"

  frontend:
    ports:
      - "${FRONTEND_BIND_IP:-127.0.0.1}:${FRONTEND_PORT:-5173}:5173"

  agent-chat:
    ports:
      - "${AGENT_CHAT_BIND_IP:-127.0.0.1}:${AGENT_CHAT_PORT:-8766}:8766"

  agent-mcp:
    ports:
      - "${AGENT_MCP_BIND_IP:-127.0.0.1}:${AGENT_MCP_PORT:-8765}:8765"
