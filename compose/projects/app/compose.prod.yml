services:
  app-postgres:
    volumes:
      - /srv/data/app/app-postgres:/var/lib/postgresql/data

  agent-postgres:
    volumes:
      - /srv/data/app/agent-postgres:/var/lib/postgresql/data

  qdrant:
    volumes:
      - /srv/data/app/qdrant:/qdrant/storage

  phoenix:
    ports:
      - "${PHOENIX_BIND_IP:-127.0.0.1}:${PHOENIX_PORT:-6006}:6006"
    volumes:
      - /srv/data/app/phoenix:/mnt/data
